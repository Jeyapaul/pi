name: Sync Upstream

# Keeps this fork synced with earendil-works/pi:
#   1. fast-forward/merge upstream/main into fork's main
#   2. merge main into "working" (Jey's Pi changes live here)
#      - clean merge  -> run checks, push working
#      - conflicts    -> open a PR targeting "working" so conflicts get fixed
#                        there first; main is never touched until working is merged
#                        into it manually

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # stripped-workflow-file flagging
  # NOTE: `workflows` is NOT a grantable scope for GITHUB_TOKEN in workflow-file
  # permissions (file-level startup failure) — upstream workflow-file changes are
  # stripped from automated pushes and flagged via issue for a manual local merge.

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "jpi-sync-bot"
          git config user.email "jpi-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/earendil-works/pi.git
          git fetch upstream main

      - name: Sync main from upstream
        id: sync_main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE=$(git rev-parse main)
          if git merge --ff-only upstream/main; then
            MODE=ff
          elif git merge upstream/main --no-edit; then
            MODE=merge
          else
            # Jey's Pi commits diverge from upstream — resolve conflicts on a
            # dedicated branch and open a PR against main for manual resolution
            git merge --abort 2>/dev/null || true
            BRANCH="sync-conflicts/main-$(date +%Y%m%d-%H%M)"
            git checkout -b "$BRANCH"
            git merge upstream/main --no-edit || true
            git add -A || true
            git commit -m "Merge upstream/main into main (conflicts marked — resolve me)" --no-verify || true
            # strip upstream workflow-file changes — GITHUB_TOKEN cannot push them
            git rm -rq --ignore-unmatch .github/workflows/ 2>/dev/null || true
            git checkout main -- .github/workflows/ 2>/dev/null || true
            git commit --amend --no-edit --no-verify || true
            git push origin "$BRANCH"
            gh pr create --repo Jeyapaul/pi --base main --head "$BRANCH" \
              --title "⚠ Upstream sync conflicts — resolve in main first" \
              --body "Fast-forward from upstream failed because fork main carries Jey's Pi commits. Resolve the conflict markers in this branch, merge the PR into main, then re-run this workflow (main → working continues automatically). NOTE: .github/workflows/ files were restored to main's versions — merge upstream workflow-file changes manually when you resolve locally." || true
            echo "conflict_pr=opened" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AFTER=$(git rev-parse main)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Upstream already synced."
          else
            # strip upstream workflow-file changes — GITHUB_TOKEN cannot push them
            # (workflows scope not grantable at file level). They get merged manually.
            if ! git diff --quiet "$BEFORE" main -- .github/workflows/; then
              git rm -rq --ignore-unmatch .github/workflows/ 2>/dev/null || true
              git checkout "$BEFORE" -- .github/workflows/
              git commit --amend --no-edit --no-verify
              echo "stripped_workflows=$(git diff --name-only "$BEFORE" upstream/main -- .github/workflows/ | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            fi
            echo "updated=true" >> "$GITHUB_OUTPUT"
            git push origin main
          fi

      - name: Flag stripped workflow files for manual merge
        if: steps.sync_main.outputs.stripped_workflows != ''
        run: |
          gh issue create --repo Jeyapaul/pi \
            --title "⚙ Upstream workflow-file changes stripped from automated sync — manual merge needed" \
            --body "The sync workflow stripped upstream changes to: ${{ steps.sync_main.outputs.stripped_workflows }}\n\nReason: GITHUB_TOKEN cannot create/update workflow files (the \`workflows\` scope is not grantable in workflow-file permissions).\n\nManual merge (2 commands):\n\`\`\`bash\ngit fetch upstream && git checkout main\ngit merge upstream/main --no-edit && git push origin main\n\`\`\`\nThen merge \`main\` → \`working\` to release."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into working
        if: steps.sync_main.outputs.updated == 'true'
        run: |
          git fetch origin working
          git checkout working
          git merge main --no-edit || {
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            echo "Merge conflicts in working — a PR will be opened."
            git status --porcelain | grep '^UU\|^AA\|^DD' || true
            exit 0
          }
          echo "conflicts=false" >> "$GITHUB_OUTPUT"

      - name: Validate merged working (clean path)
        if: steps.merge_working.outputs.conflicts == 'false' && steps.sync_main.outputs.updated == 'true'
        run: |
          npm ci --ignore-scripts
          sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd
          npm run build:offline
          npm run check
          npm test
          git push origin working

      - name: Open conflict-resolution PR against working
        if: steps.merge_working.outputs.conflicts == 'true'
        run: |
          BRANCH="sync-conflicts/$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          # keep the conflicted merge in progress as a commit for manual resolution
          git add -A || true
          git commit -m "Merge main into working (conflicts marked — resolve me)" --no-verify || true
          git push origin "$BRANCH"
          gh pr create \
            --repo Jeyapaul/pi \
            --base working \
            --head "$BRANCH" \
            --title "⚠ Upstream sync conflicts — resolve in working first" \
            --body "Upstream main was synced into the fork, but merging into \`working\` hit conflicts. Resolve the conflicts in this branch (conflicted files are committed with conflict markers), then merge this PR into \`working\`. After \`working\` is clean, merge \`working\` → \`main\` to release." \
            || echo "PR creation failed (may already exist)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}